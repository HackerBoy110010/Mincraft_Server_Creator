name: tests

permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project
        run: python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      - name: Install build frontend
        run: python -m pip install build
      - name: Build wheel and source archive
        run: python -m build
      - name: Verify wheel installation and CLI entry point
        run: |
          python -m venv "$RUNNER_TEMP/mcsc-wheel-test"
          "$RUNNER_TEMP/mcsc-wheel-test/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/mcsc-wheel-test/bin/mcsc" --help
      - name: Upload test packages
        uses: actions/upload-artifact@v4.6.2
        with:
          name: mcsc-python-package-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
