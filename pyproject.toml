[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minecraft-server-creator"
version = "0.1.0"
description = "SSH-friendly terminal manager for Minecraft Java servers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mcsc = "minecraft_server_creator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
